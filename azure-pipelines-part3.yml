trigger:
  branches:
    include:
      - main
      - donations-feature
      - volunteer-feature

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: Release
  solution: '**/*.sln'
  webProject: 'GiftOfTheGiversReliefSystem.csproj'
  functionProject: 'GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj'
  azureServiceConnection: 'YOUR-AZURE-SERVICE-CONNECTION'
  appServiceName: 'YOUR-APP-SERVICE-NAME'
  functionAppName: 'YOUR-FUNCTION-APP-NAME'

stages:
- stage: BuildAndTest
  displayName: Build and Test
  jobs:
  - job: BuildTest
    steps:
    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x

    - task: DotNetCoreCLI@2
      displayName: Restore solution
      inputs:
        command: restore
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: Build solution
      inputs:
        command: build
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: Run unit and integration tests
      inputs:
        command: test
        projects: |
          Tests/GiftOfTheGivers.UnitTests/GiftOfTheGivers.UnitTests.csproj
          Tests/GiftOfTheGivers.IntegrationTests/GiftOfTheGivers.IntegrationTests.csproj
        arguments: '--configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage"'
        publishTestResults: true

    - task: DotNetCoreCLI@2
      displayName: Publish ASP.NET Core application
      inputs:
        command: publish
        publishWebProjects: false
        projects: '$(webProject)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: true

    - task: DotNetCoreCLI@2
      displayName: Publish Azure Function
      inputs:
        command: publish
        publishWebProjects: false
        projects: '$(functionProject)'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/function'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: Publish web artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/web'
        ArtifactName: webapp

    - task: PublishBuildArtifacts@1
      displayName: Publish function artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/function'
        ArtifactName: functionapp

- stage: DeployWeb
  displayName: Deploy Web App
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - deployment: DeployAppService
    environment: GiftOfTheGivers-Production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: webapp
          - task: AzureWebApp@1
            displayName: Deploy ASP.NET Core to Azure App Service
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: webApp
              appName: '$(appServiceName)'
              package: '$(Pipeline.Workspace)/webapp/**/*.zip'

- stage: DeployFunction
  displayName: Deploy Azure Function
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - deployment: DeployFunctionApp
    environment: GiftOfTheGivers-Function-Production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: functionapp
          - task: AzureFunctionApp@2
            displayName: Deploy Donation Function
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: functionApp
              appName: '$(functionAppName)'
              package: '$(Pipeline.Workspace)/functionapp/**/*.zip'
