trigger:
  branches:
    include:
      - main
      - donations-feature
      - volunteer-feature

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Run tests'
  inputs:
    command: 'test'
    projects: |
      Tests/GiftOfTheGivers.UnitTests/GiftOfTheGivers.UnitTests.csproj
      Tests/GiftOfTheGivers.IntegrationTests/GiftOfTheGivers.IntegrationTests.csproj
    arguments: '--configuration $(buildConfiguration) --no-build'
    publishTestResults: true
